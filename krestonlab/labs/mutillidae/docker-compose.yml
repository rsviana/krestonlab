
version: '3'
services:
  mutillidae:
    image: citizenstig/nowasp
    container_name: mutillidae
    ports:
      - "8082:80"
    environment:
      MYSQL_DATABASE: owasp10
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_HOST: mysql
    depends_on:
      - mysql
    networks:
      - krestonlab_net

  mysql:
    image: mysql:5.7
    container_name: mutillidae_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: owasp10
    ports:
      - "3307:3306"
    networks:
      - krestonlab_net

networks:
  krestonlab_net:
